<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mera Personal AI</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; max-width: 600px; margin: 40px auto; padding: 20px; }
        .box { background: #1e293b; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        input, textarea { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: none; box-sizing: border-box; font-size: 15px; }
        button { width: 100%; padding: 12px; background: #22c55e; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
        button:hover { background: #16a34a; }
        #output { margin-top: 20px; padding: 15px; background: #0f172a; border-radius: 8px; white-space: pre-wrap; line-height: 1.6; }
    </style>
</head>
<body>
    <div class="box">
        <h2>🤖 Mera Personal AI</h2>
        <input type="password" id="key" placeholder="Yahan apni API Key paste karo">
        <textarea id="prompt" rows="3" placeholder="Apna sawal yahan likho..."></textarea>
        <button id="askBtn">Jawab Pucho</button>
        <div id="output">Yahan AI ka jawab aayega...</div>
    </div>

    <script type="module">
        import { GoogleGenAI } from "https://esm.run";

        document.getElementById("askBtn").addEventListener("click", async () => {
            const key = document.getElementById("key").value.trim();
            const prompt = document.getElementById("prompt").value.trim();
            const output = document.getElementById("output");

            if (!key || !prompt) {
                output.innerText = "Pehle API Key aur Sawal dono bharo!";
                return;
            }

            output.innerText = "Soch raha hoon...";

            try {
                const ai = new GoogleGenAI({ apiKey: key });
                const response = await ai.models.generateContent({
                    model: "gemini-2.5-flash",
                    contents: prompt,
                });
                output.innerText = response.text;
            } catch (e) {
                output.innerText = "Error: " + (e.message || JSON.stringify(e));
            }
        });
    </script>
</body>
</html>
